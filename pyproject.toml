[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraflow"
version = "0.1.0"
description = "Offline-first team workflow manager using Local SQLite and NAS snapshots"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.0,<3.0",
  "PySide6>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
build = [
  "Nuitka>=2.6,<5.0",
  "ordered-set",
  "zstandard",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
